# docker-stack.yaml

# network 만들기 
networks:
  db-net:
    driver: overlay

# DB 에서 사용할 nfs 와 연동된 volume 을 준비한다
volumes:
  postgres_main:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.16.8.203,rw,nfsvers=4
      device: ":/nfs/shared/postgres_main"
  postgres_replica:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.16.8.203,rw,nfsvers=4
      device: ":/nfs/shared/postgres_replica"
# 클러스터에서 사용할 config 를 등록하기
configs:
  db_init:
    file: ./init.sql # 현재 경로에 있는 init.sql 파일이 swarm 클러스터에 배포된다는 느낌으로 사용하면된다.
  nginx_config:
    file: ./nginx.conf

services:
  # =====================================================================
  # 1. 마스터 DB (pg-main)
  # =====================================================================
  pg-main:
    image: postgres:15
    environment:
      POSTGRES_USER: scott
      POSTGRES_PASSWORD: tiger
      POSTGRES_DB: scott_db
    ports:
      - target: 5432       
        published: 5431    
        mode: host  
    # nfs 연동된 볼륨 연결        
    volumes:
      - postgres_main:/var/lib/postgresql/data
    networks:
      - db-net 
    # config 에 등록된 내용을 읽어와서 사용한다
    configs:
      - source: db_init
        target: /docker-entrypoint-initdb.d/init.sql
    # replica DB 가 동작 할수 있도록 셋팅
    entrypoint: ["bash", "-c"]
    command: 
      - |
        mkdir -p /docker-entrypoint-initdb.d
        echo 'echo "host replication all 0.0.0.0/0 md5" >> /var/lib/postgresql/data/pg_hba.conf' > /docker-entrypoint-initdb.d/allow_repl.sh
        chmod +x /docker-entrypoint-initdb.d/allow_repl.sh
        exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10
    deploy:
      # master DB 는 보통 성능지 좋은 node 에 배포하지만 여기에서는 manager node 에 배포하자
      placement:
        constraints: [node.role == manager] 
      endpoint_mode: dnsrr 

  # =====================================================================
  # 2. 레플리카 DB
  # =====================================================================
  pg-replica:
    image: postgres:15
    environment:
      PGPASSWORD: tiger 
    ports:
      - target: 5432
        published: 5433
        mode: host         
    volumes:              
      - postgres_replica:/var/lib/postgresql/data
    networks:
      - db-net
    entrypoint: ["bash", "-c"]
    command:
      - |
        # 1. 마스터 DB가 응답할 때까지 안전하게 대기
        echo "Waiting for pg-main to be ready..."
        until pg_isready -h pg-main -U scott -d scott_db; do
          sleep 2
        done

        # 2. (최초 1회) basebackup 수행
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Starting basebackup from pg-main..."
          rm -rf /var/lib/postgresql/data/*
          # -R 옵션이 standby.signal 파일을 자동으로 만들어 레플리카 모드로 작동하게 한다
          pg_basebackup -h pg-main -U scott -D /var/lib/postgresql/data -Fp -Xs -P -R
          echo "Basebackup completed!"
        fi

        # 3. 백업 점검 후 레플리카 구동
        exec docker-entrypoint.sh postgres
    deploy:
      endpoint_mode: dnsrr
    
  # 3. 백엔드 앱
  member-app:
    image: myoli999/member-app:1.1
    environment:
      # 위에서 작성한 DB 의 서비스명을 확인한다
      # postgresql://scott:tiger@<DB 서비스명>:5432/scott_db
      WRITABLE_URL: "postgresql://scott:tiger@pg-main:5432/scott_db"
      READONLY_URL: "postgresql://scott:tiger@pg-replica:5432/scott_db"
    networks:
      - db-net
    deploy:
      replicas: 1
  # 3. 백엔드 앱2
  post-app:
    image: myoli999/post-app:1.0
    environment:
      # 위에서 작성한 DB 의 서비스명을 확인한다
      # postgresql://scott:tiger@<DB 서비스명>:5432/scott_db
      WRITABLE_URL: "postgresql://scott:tiger@pg-main:5432/scott_db"
      READONLY_URL: "postgresql://scott:tiger@pg-replica:5432/scott_db"
    networks:
      - db-net
    deploy:
      replicas: 1

  # 인덱스 앱
  index-app:
    image: myoli999/index-app:1.0
    networks:
      - db-net
    deploy:
      replicas: 1

  # 인그레스 역활을 하는 nginx-app
  nginx-app:
    image: nginx:latest
    ports:
      - "80:80" # host 의 80 port 를 container 의 80 port 로 연결
    networks:
      - db-net
    deploy:
      replicas: 1
    # nginx 의 동작이 정의된 nginx_config 파일을 컨테이너에 연결한다 
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf