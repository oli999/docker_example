# nginx 설정 파일  nginx.conf

# 동시접속 상한선 설정
events {
    worker_connections 1024;
}

http {
    # 1. 트래픽을 보낼 목적지(Upstream) 정의
    upstream fastapi_backend {
        # 'swarm-fastapi'는 docker-stack.yml에 정의된 서비스 이름입니다.
        # 도커 스웜의 내장 DNS가 이 이름을 알아서 해석하고, 
        # 2개의 컨테이너로 트래픽을 라운드 로빈(Round-Robin) 방식으로 알아서 분산해 줍니다!
        server swarm-fastapi:8000;
    }

    # 2. 웹 서버 설정
    server {
        listen 80;

        location / {
            # 위에서 정의한 upstream 그룹으로 트래픽을 토스!
            proxy_pass http://fastapi_backend;
            
            # 클라이언트의 실제 IP와 호스트 정보를 백엔드에 그대로 전달해 줍니다.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}