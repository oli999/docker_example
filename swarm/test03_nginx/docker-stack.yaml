# swram/test02/docker-stack.yaml
# swarm 에서는  stack 파일을 만들어 놓고 
# 배포할때는  docker stack deploy -c  <파일명> <stack명> 해서 배포를 한다  

networks:
  # my-net 이라는 이름의 network 를 만들겠다 
  my-net:
    # cluster 환경이기 때문에 overlay 로 설정 
    driver: overlay

volumes:
  # 클러스터 환경에서 이런 volume 은 node 를 고정해서 사용하지 않는 이상 의미가 없는 volume 설정이다  
  # postgres db 가 사용할 볼륨설정
  pgdata:

# docker-stack.yaml 을 실행하는 node 의 현재 경로에 있는 nginx.conf 파일을 
# 클라스터에 있는 모든 node 에서 실행하는 서비스(container)에서 사용할수 있도록 등록한다 
configs:
  nginx_config: # 이름은 마음대로 지을수 있다.
    file: ./nginx.conf

services:
  my-nginx:
    image: nginx:latest
    # host 의 80 port 연결은 container(nginx) 의 80 port 로 연결하겠다  
    ports:
      - '80:80'
    networks:
      - my-net
    deploy:
      replicas: 2
    # 미리 정의해서 설정한 nginx_config 를 사용하기 
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf

  swarm-fastapi:
    image: myoli999/swarm-fastapi:1.1
    environment:
      # container 의 이름이 아닌 서비스의 이름이 db 접속 url 에 들어가는것을 유의한다 
      # postgresql://scott:tiger@<db서비스이름>:5432/scott_db
      - DB_URL=postgresql://scott:tiger@my-postgres:5432/scott_db
    # nginx 를 통해서 요청을 전달 받기 때문에 아래의 설정은 필요가 없다
    # ports:
    #   - '8000:8000'
    networks:
      - my-net
    deploy:
      replicas: 1
      # container 가 교체 될때 적용할 옵션
      update_config:
        parallelism: 1 # 한번에 1대씩 교체 (기본값)
        delay: 10s  # 1대 교체하고 다음 교체 까지 10초 지연 (안정성 확보)
        order: start-first # 기존것을 끄기전에 새버전을 띄우고 기존것을 꺼라 (무중단)
        failure_action: rollback # 새버전이 에러나면 자동으로 구버전으로 롤백
        monitor: 15s # 새버전 띄우고 15초 지켜보기 (죽는지 안죽는지)
        max_failure_ratio: 0 # 1대라로 실패하면 즉시 실패로 간주하기 
  # db 서비스 
  my-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: scott
      POSTGRES_PASSWORD: tiger
      POSTGRES_DB: scott_db
    volumes:
      # 미리 준비한 volume 을 연결하고 
      - pgdata:/varlib/postgresql/data
      # nfs 에 연결된 폴더의 파일을 bind mount 한다 
      # 처음 db 가 활성화 될때 최초 1번만 실행된다. 이미 사용하던 volume 이 있으면 실행안됨
      - /mnt/nfs/pg_init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my-net
    deploy:
      # DB 는 replicas 1 개 
      replicas: 1
      # 배포되는 node 를 직접 조건을 통해서 지정할수 있다.
      placement:
        constraints: [node.hostname == mgmt]
